# Split panes using % and -
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
unbind '"'

# Auto resize horizontally and vertically
bind + select-layout tiled

# Configure color for terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable extra features
set -g allow-passthrough on
set -s extended-keys on
set -g focus-events on
set -as terminal-features 'xterm*:extkeys'

# Count from 1 instead of 0, and renumber on close
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
setw -g automatic-rename on

# Increase history limit
set -g history-limit 10000

# Activate mouse use
set -g mouse on

# Plain drag does nothing, Option+drag selects inside a single pane
unbind -n MouseDrag1Pane
unbind -T copy-mode MouseDrag1Pane
unbind -T copy-mode-vi MouseDrag1Pane

bind -n M-MouseDrag1Pane if -Ft= "#{mouse_any_flag}" "if -Ft= '#{pane_in_mode}' 'copy-mode -M' 'send -M'" "copy-mode -M"
bind -T copy-mode-vi M-MouseDrag1Pane select-pane \; send -X begin-selection

# Disable delay between escape key and subsequent sequence
set -sg escape-time 0

# Display activity
set -g monitor-activity on
set -g visual-activity off

# Status bar
set -g status 'on'
set -g status-bg 'colour235'
set -g status-right-length '80'
set -g status-left ''
set -g status-right '#[fg=colour255,bg=colour235] #( ~/.tmux_stock ) #[fg=colour222,bg=colour238] #H '
setw -g window-status-format '#[fg=colour2,bg=colour235] #I #W '
setw -g window-status-current-style 'none'
setw -g window-status-current-format '#[fg=colour11,bg=colour238] #I #W #F '
set -g status-interval 300

# Turn on vim binding in copy mode
set-option -g status-keys vi
set-window-option -g mode-keys vi

# Switch panes using vim style
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use a to toggle synchronize panes
bind a set-window-option synchronize-panes

# Copy mode option
bind / copy-mode

# Import macOS-only config
if-shell 'test "$(uname -s)" = Darwin' 'source-file ${HOME}/.tmux-osx.conf'
